<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analogy Validation Task</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #f7f7f5;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(900px, 92vw);
      min-height: 620px;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .screen {
      width: 100%;
    }

    .instructions {
      max-width: 920px;
      margin: 0 auto;
      font-size: 24px;
      line-height: 1.35;
      text-align: center;
    }

    .instructions p {
      margin: 0 0 16px;
    }

    .instruction-line {
      white-space: nowrap;
    }

    .small {
      margin-top: 28px;
      font-size: 18px;
      color: #444;
    }

    .fixation {
      font-size: 64px;
      line-height: 1;
    }

    .analogy {
      min-height: 420px;
      position: relative;
      display: grid;
      place-items: center;
      font-size: clamp(36px, 6vw, 56px);
      font-weight: 600;
      letter-spacing: 0;
    }

    .instruction-example {
      min-height: 260px;
      margin: 18px 0;
      font-size: clamp(34px, 5vw, 50px);
    }

    .instruction-example .term-layout {
      width: min(560px, 82vw);
    }

    .term-layout {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      width: min(760px, 92vw);
      margin: 0 auto;
    }

    .term-layout::before,
    .term-layout::after {
      content: ":";
      position: absolute;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .term-layout::before {
      top: 25%;
    }

    .term-layout::after {
      top: 75%;
    }

    .corner-term {
      display: grid;
      place-items: center;
      text-align: center;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .center-slot {
      min-height: 1.2em;
      display: grid;
      place-items: center;
      position: relative;
      z-index: 1;
    }

    .invisible {
      visibility: hidden;
    }

    .choices {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: min(620px, 90vw);
      margin: 24px auto 0;
      font-size: 22px;
      color: #333;
    }

    .choice-button {
      border: 1px solid #777;
      background: #fff;
      color: #111;
      min-width: 128px;
    }

    .choice-button:hover {
      background: #ececea;
    }

    .feedback {
      font-size: 64px;
      line-height: 1;
      font-weight: 700;
    }

    .correct {
      color: #176f43;
    }

    .incorrect {
      color: #a02b2b;
    }

    button {
      appearance: none;
      border: 1px solid #1f2937;
      background: #1f2937;
      color: white;
      border-radius: 6px;
      padding: 12px 18px;
      font-size: 18px;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid #4f8cff;
      outline-offset: 3px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 18px;
      color: #333;
      text-align: left;
    }

    input {
      box-sizing: border-box;
      width: min(420px, 86vw);
      border: 1px solid #777;
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 20px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <main id="app" aria-live="polite"></main>

  <script>
    const RESPONSE_KEYS = {
      invalid: "ArrowLeft",
      valid: "ArrowRight"
    };

    const PRACTICE_TRIALS = [

      { A: "furnace", B: "coal", C: "beach", D: "ocean", valid: false, class: "False", semanticDistance: 0.97, difficulty: 2.39 },
      { A: "sugar", B: "coffee", C: "grinder", D: "bean", valid: false, class: "False", semanticDistance: 0.92, difficulty: 3.85 },
      { A: "aspirin", B: "pain", C: "foot", D: "sock", valid: false, class: "False", semanticDistance: 0.85, difficulty: 3.61 },
      { A: "landscaper", B: "lawn", C: "fence", D: "field", valid: false, class: "False", semanticDistance: 0.69, difficulty: 2.37 },
      { A: "train", B: "track", C: "conductor", D: "whistle", valid: false, class: "False", semanticDistance: 0.69, difficulty: 2.23 },
      { A: "answer", B: "riddle", C: "key", D: "lock", valid: true, class: "Cross-Domain", semanticDistance: 0.82, difficulty: 3.53 },
      { A: "ash", B: "fireplace", C: "lint", D: "pocket", valid: true, class: "Cross-Domain", semanticDistance: 0.81, difficulty: 3.82 },

      { A: "blizzard", B: "snowflake", C: "army", D: "soldier", valid: true, class: "Cross-Domain", semanticDistance: 0.99, difficulty: 3.87 },
      { A: "bracelet", B: "wrist", C: "moat", D: "castle", valid: true, class: "Cross-Domain", semanticDistance: 0.88, difficulty: 4.23 },
      { A: "burger", B: "bun", C: "book", D: "cover", valid: true, class: "Cross-Domain", semanticDistance: 0.92, difficulty: 3.47 },
      { A: "eraser", B: "pencil", C: "amnesia", D: "memory", valid: true, class: "Cross-Domain", semanticDistance: 0.91, difficulty: 2.54 },
      { A: "father", B: "son", C: "inventor", D: "invention", valid: true, class: "Cross-Domain", semanticDistance: 0.91, difficulty: 3.39 },
      { A: "flock", B: "goose", C: "constellation", D: "star", valid: true, class: "Cross-Domain", semanticDistance: 0.96, difficulty: 3.73 },

      { A: "landscaper", B: "lawn", C: "stylist", D: "hair", valid: true, class: "Cross-Domain", semanticDistance: 0.83, difficulty: 3.68 },
      { A: "launchpad", B: "helicopter", C: "divingboard", D: "diver", valid: true, class: "Cross-Domain", semanticDistance: 0.83, difficulty: 3.98 },
      { A: "lawschool", B: "lawyer", C: "vineyard", D: "wine", valid: true, class: "Cross-Domain", semanticDistance: 0.95, difficulty: 6.74 },
      { A: "movie", B: "screen", C: "lightning", D: "sky", valid: true, class: "Cross-Domain", semanticDistance: 0.89, difficulty: 5.44 },
      { A: "multiplication", B: "product", C: "brewing", D: "beer", valid: true, class: "Cross-Domain", semanticDistance: 0.9, difficulty: 6.94 },
      { A: "nose", B: "scent", C: "antenna", D: "signal", valid: true, class: "Cross-Domain", semanticDistance: 0.93, difficulty: 4.92 },
      { A: "orchard", B: "apple", C: "neighborhood", D: "apartment", valid: true, class: "Cross-Domain", semanticDistance: 0.9, difficulty: 6.78 },
      { A: "painting", B: "canvas", C: "birthmark", D: "skin", valid: true, class: "Cross-Domain", semanticDistance: 0.97, difficulty: 3.85 },
      { A: "pen", B: "pig", C: "reservoir", D: "water", valid: true, class: "Cross-Domain", semanticDistance: 0.89, difficulty: 5.06 },
      { A: "rectangle", B: "perimeter", C: "nation", D: "border", valid: true, class: "Cross-Domain", semanticDistance: 0.97, difficulty: 3.73 },
      { A: "revising", B: "manuscript", C: "evolving", D: "species", valid: true, class: "Cross-Domain", semanticDistance: 0.98, difficulty: 3.4 },
      { A: "saxophone", B: "jazz", C: "typewriter", D: "poetry", valid: true, class: "Cross-Domain", semanticDistance: 0.85, difficulty: 3.36 },
      { A: "sugar", B: "coffee", C: "incentive", D: "deal", valid: true, class: "Cross-Domain", semanticDistance: 0.86, difficulty: 6.23 },
      { A: "thermometer", B: "temperature", C: "polygraph", D: "honesty", valid: true, class: "Cross-Domain", semanticDistance: 0.99, difficulty: 3.73 },
      { A: "train", B: "track", C: "signal", D: "wire", valid: true, class: "Cross-Domain", semanticDistance: 0.86, difficulty: 4.6 },
      
    ];

    const app = document.querySelector("#app");
    const results = [];
    let participantId = "";
    let trialNumber = 0;

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function render(html) {
      app.innerHTML = `<section class="screen">${html}</section>`;
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function showParticipantPrompt() {
      render(`
        <form class="instructions" id="participant-form">
          <label for="participant-id">Participant ID</label>
          <input id="participant-id" name="participant-id" autocomplete="off" required>
          <button type="submit">Continue</button>
        </form>
      `);

      document.querySelector("#participant-id").focus();
      document.querySelector("#participant-form").addEventListener("submit", event => {
        event.preventDefault();
        participantId = document.querySelector("#participant-id").value.trim();
        if (participantId) showInstructions();
      });
    }

    function showInstructions() {
      render(`
        <div class="instructions">
          <p class="instruction-line">In this task, you are going to view some pairs of words like below.</p>
          <p class="instruction-line">Your job is to <strong>evaluate whether the analogy, A:B::C:D, is valid or not</strong>.</p>
          <div class="analogy instruction-example" aria-label="Example analogy format: A to B, C to D">
            <div class="term-layout">
              <span class="corner-term">A</span>
              <span class="corner-term">B</span>
              <span class="corner-term">C</span>
              <span class="corner-term">D</span>
            </div>
          </div>
          <p class="instruction-line">You will have up to <strong>8s</strong> to respond.</p>
          <p class="instruction-line">Accuracy is more important than speed, so try to respond as accurately as possible.</p>
          <p class="small instruction-line">Press the left arrow key for invalid.</p>
          <p class="small instruction-line">Press the right arrow key for valid.</p>
          <button id="start">Start practice</button>
        </div>
      `);
      document.querySelector("#start").addEventListener("click", runTask, { once: true });
    }

    async function runTask() {
      for (const trial of PRACTICE_TRIALS) {
        await runTrial(trial, "practice");
      }

      render(`
        <div class="instructions">
          <p>The practice trials are complete.</p>
          <p class="small">Press the button below when you are ready to begin the main task.</p>
          <button id="continue">Begin main task</button>
        </div>
      `);

      await new Promise(resolve => {
        document.querySelector("#continue").addEventListener("click", resolve, { once: true });
      });

      for (const trial of shuffle(TEST_TRIALS)) {
        await runTrial(trial, "test");
      }

      showEndScreen();
    }

    async function runTrial(trial, phase) {
      trialNumber += 1;
      renderTrialDisplay(trial, { showFixation: true, showChoices: false });
      await wait(500);

      const start = performance.now();
      const response = await collectResponse(trial);
      const rt = response.rt === null ? null : Math.round(response.rt);
      const selectedValid = response.choice;
      const correct = selectedValid === trial.valid;

      results.push({
        participantId,
        trialNumber,
        phase,
        A: trial.A,
        B: trial.B,
        C: trial.C,
        D: trial.D,
        class: trial.class || "",
        semanticDistance: trial.semanticDistance || "",
        difficulty: trial.difficulty || "",
        correctAnswer: trial.valid ? "valid" : "invalid",
        response: selectedValid === null ? "timeout" : selectedValid ? "valid" : "invalid",
        key: response.key || "",
        rt,
        correct
      });

      if (correct && !response.timedOut) return;

      showFeedback(response.timedOut ? "Too slow" : "Incorrect", false);
      await wait(900);
    }

    function collectResponse(trial) {
      renderTrialDisplay(trial, { showFixation: false, showChoices: true });

      const start = performance.now();
      return new Promise(resolve => {
        let settled = false;
        const invalidButton = document.querySelector("#invalid-choice");
        const validButton = document.querySelector("#valid-choice");
        const timeout = setTimeout(() => finish(null, null, true), 8000);

        function finish(key, choice, timedOut) {
          if (settled) return;
          settled = true;
          clearTimeout(timeout);
          window.removeEventListener("keydown", onKeydown);
          invalidButton.removeEventListener("click", onInvalidClick);
          validButton.removeEventListener("click", onValidClick);
          resolve({
            key,
            choice,
            timedOut,
            rt: timedOut ? null : performance.now() - start
          });
        }

        function onInvalidClick() {
          finish("click-invalid", false, false);
        }

        function onValidClick() {
          finish("click-valid", true, false);
        }

        function onKeydown(event) {
          if (event.key === RESPONSE_KEYS.invalid || event.key === RESPONSE_KEYS.valid) {
            event.preventDefault();
            finish(event.key, event.key === RESPONSE_KEYS.valid, false);
          }
        }

        window.addEventListener("keydown", onKeydown);
        invalidButton.addEventListener("click", onInvalidClick);
        validButton.addEventListener("click", onValidClick);
      });
    }

    function renderTrialDisplay(trial, { showFixation, showChoices }) {
      const hiddenClass = showFixation ? " invisible" : "";
      const choicesClass = showChoices ? "" : " invisible";

      render(`
        <div>
          <div class="analogy">
            <div class="term-layout${hiddenClass}">
              <span class="corner-term">${trial.A}</span>
              <span class="corner-term">${trial.B}</span>
              <span class="corner-term">${trial.C}</span>
              <span class="corner-term">${trial.D}</span>
            </div>
            <div class="center-slot">${showFixation ? '<span class="fixation">+</span>' : ''}</div>
          </div>
          <div class="choices${choicesClass}">
            <button class="choice-button" id="invalid-choice" type="button">invalid</button>
            <button class="choice-button" id="valid-choice" type="button">valid</button>
          </div>
        </div>
      `);
    }

    function showFeedback(text, correct) {
      render(`
        <div>
          <div class="analogy">
            <div></div>
            <div class="center-slot">
              <span class="feedback ${correct ? "correct" : "incorrect"}">${text}</span>
            </div>
            <div></div>
          </div>
          <div class="choices invisible">
            <button class="choice-button" type="button">invalid</button>
            <button class="choice-button" type="button">valid</button>
          </div>
        </div>
      `);
    }

    function showEndScreen() {
      downloadCsv();
      render(`
        <div class="instructions">
          <p>Thank you for your participation!</p>
          <p>The data will be downloaded automatically.</p>
        </div>
      `);
    }

    function downloadCsv() {
      const headers = Object.keys(results[0]);
      const lines = [
        headers.join(","),
        ...results.map(row => headers.map(header => csvCell(row[header])).join(","))
      ];
      const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const safeParticipantId = participantId.replace(/[^a-z0-9_-]/gi, "_") || "participant";
      const timestamp = localTimestamp();
      link.href = url;
      link.download = `S${safeParticipantId}_part1_con1_evaluation_${timestamp}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    }

    function localTimestamp() {
      const now = new Date();
      const date = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0")
      ].join("-");
      const time = [
        String(now.getHours()).padStart(2, "0"),
        String(now.getMinutes()).padStart(2, "0"),
        String(now.getSeconds()).padStart(2, "0")
      ].join("-");
      return `${date}_${time}`;
    }

    function csvCell(value) {
      const text = value === null || value === undefined ? "" : String(value);
      return /[",\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
    }

    showParticipantPrompt();
  </script>
</body>
</html>
